[project]
name = "voice-notes-tr-sidecar"
version = "0.1.0"
description = "faster-whisper sidecar for Voice Notes TR (JSON-over-stdio)"
requires-python = ">=3.10,<3.13"
dependencies = [
    "faster-whisper>=1.2.0",
]

[project.scripts]
voice-notes-sidecar = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]
